# licencas.gestaoagil.com.br: a API das licencas e revendas (kestrel-site, 127.0.0.1:8000), so por HTTPS.
# Os programas novos (Caixa, OfficeManager/Startup) verificam a licenca aqui e, se nao conseguirem
# (Windows sem TLS 1.2), em http://revendas.brpdv.com.br/api/ (o mesmo servidor).
# Em /etc/nginx/conf.d/licencas.conf no servidor 76.13.236.246; certificado do certbot (webroot).
server {
	listen 80;
	server_name licencas.gestaoagil.com.br;
	root /var/www/html;

	location /.well-known/acme-challenge/ {
		try_files $uri =404;
	}
	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	listen 443 ssl;
	server_name licencas.gestaoagil.com.br;

	ssl_certificate /etc/letsencrypt/live/licencas.gestaoagil.com.br/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/licencas.gestaoagil.com.br/privkey.pem;
	include /etc/letsencrypt/options-ssl-nginx.conf;
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

	client_max_body_size 1m;
	add_header X-Content-Type-Options "nosniff" always;

	location /api {
		proxy_pass http://127.0.0.1:8000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Connection "";
	}
	location / {
		return 404;
	}
}
