# revendas.brpdv.com.br: pagina estatica (/var/www/revendas) e a API do site (kestrel-site, 127.0.0.1:8000) em /api.
# Copia do servidor antigo (166.0.186.213), no servidor novo (76.13.236.246) em /etc/nginx/conf.d/revendas.conf.
# So HTTP por enquanto (como no antigo): os programas instalados chamam http://revendas.brpdv.com.br/api/.
server {
	listen 80;
	server_name revendas.brpdv.com.br;
	root /var/www/revendas;

	add_header X-Frame-Options "SAMEORIGIN";
	add_header X-Content-Type-Options "nosniff";
	index index.html;
	charset utf-8;

	location / {
		try_files $uri $uri/ /index.html;
	}

	location /api {
		proxy_pass http://127.0.0.1:8000;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection keep-alive;
		proxy_set_header Host $host;
		proxy_cache_bypass $http_upgrade;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location = /favicon.ico { access_log off; log_not_found off; }
	location = /robots.txt { access_log off; log_not_found off; }
	location ~ /\.(?!well-known) { deny all; }
}
