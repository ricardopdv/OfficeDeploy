# So em HTTPS: faz o navegador trocar as chamadas http:// fixas do front-end por https://
map $https $revendas_csp { on "upgrade-insecure-requests"; default ""; }
# revendas.brpdv.com.br: pagina estatica (/var/www/revendas) e a API do site (kestrel-site, 127.0.0.1:8000) em /api.
# Em /etc/nginx/conf.d/revendas.conf no servidor 166.0.186.213.
# As paginas do site redirecionam HTTP -> HTTPS. O /api NAO redireciona: os programas instalados (caixa, OfficeManager) chamam http://revendas.brpdv.com.br/api/.
server {
	listen 80;
	server_name revendas.brpdv.com.br;
	root /var/www/revendas;

	add_header X-Frame-Options "SAMEORIGIN";
	add_header X-Content-Type-Options "nosniff";
	add_header Content-Security-Policy $revendas_csp;
	index index.html;
	charset utf-8;

	location / {
		if ($scheme = http) { return 301 https://$host$request_uri; }
		try_files $uri $uri/ /index.html;
	}

	location /api {
		proxy_pass http://127.0.0.1:8000;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection keep-alive;
		proxy_set_header Host $host;
		proxy_cache_bypass $http_upgrade;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location = /favicon.ico { access_log off; log_not_found off; }
	location = /robots.txt { access_log off; log_not_found off; }
	location ~ /\.(?!well-known) { deny all; }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/revendas.brpdv.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/revendas.brpdv.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
