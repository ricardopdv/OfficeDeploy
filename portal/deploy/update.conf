# update.brpdv.com.br: atualizacoes dos programas (publicas) e portal de downloads dos instaladores (com login).
# Instalado pelo PublicarPortal.ps1 em /etc/nginx/conf.d/update.conf. Certificado do Let's Encrypt (certbot).

# HTTP: so as atualizacoes (Windows antigos sem TLS 1.2); o resto vai para HTTPS (o login nunca trafega sem criptografia)
server {
	listen 80;
	server_name update.brpdv.com.br;
	root /var/www/update;

	location /atualizacoes/ {
		try_files $uri =404;
	}
	location ~* ^/atualizacoes/.*AutoUpdater\.xml$ {
		add_header Cache-Control "no-cache";
		try_files $uri =404;
	}
	location /.well-known/acme-challenge/ {
		try_files $uri =404;
	}
	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	listen 443 ssl;
	server_name update.brpdv.com.br;
	root /var/www/update;

	ssl_certificate /etc/letsencrypt/live/update.brpdv.com.br/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/update.brpdv.com.br/privkey.pem;
	include /etc/letsencrypt/options-ssl-nginx.conf;
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

	client_max_body_size 1m;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "SAMEORIGIN" always;

	# pacotes do AutoUpdater: publicos (os programas baixam sem login)
	location /atualizacoes/ {
		try_files $uri =404;
	}
	location ~* ^/atualizacoes/.*AutoUpdater\.xml$ {
		add_header Cache-Control "no-cache";
		try_files $uri =404;
	}

	# instaladores: so pelo portal (o app confere o login e devolve X-Accel-Redirect para esta location interna)
	location /_instaladores/ {
		internal;
		alias /var/www/update/instaladores/;
	}
	location /instaladores/ {
		return 302 /;
	}

	location ~ /\.(?!well-known) {
		deny all;
	}

	# portal (login e lista): app ASP.NET Core em 127.0.0.1:8010 (update-portal.service)
	location / {
		proxy_pass http://127.0.0.1:8010;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Connection "";
	}
}
