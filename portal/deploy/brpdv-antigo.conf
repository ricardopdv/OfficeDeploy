# update.brpdv.com.br no servidor antigo (166.0.186.213), em /etc/nginx/conf.d/update.conf.
# O servidor de atualizacoes mudou para update.gestaoagil.com.br (76.13.236.246). Aqui ficam:
#  - o login das revendas por HTTPS, so para o portal de downloads do servidor novo (a API do site so tem HTTP);
#  - redirecionamento de tudo o mais para o endereco novo (programas que ainda usam o endereco antigo).

server {
	listen 80;
	server_name update.brpdv.com.br;

	# mantem o esquema: o http novo serve as atualizacoes (Windows antigos sem TLS 1.2) e manda o resto para https
	location / {
		return 301 http://update.gestaoagil.com.br$request_uri;
	}
}

server {
	listen 443 ssl;
	server_name update.brpdv.com.br;

	ssl_certificate /etc/letsencrypt/live/update.brpdv.com.br/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/update.brpdv.com.br/privkey.pem;
	include /etc/letsencrypt/options-ssl-nginx.conf;
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

	client_max_body_size 64k;

	# login do portal de downloads (servidor novo): so este IP
	location = /api/Accounts/Login {
		allow 76.13.236.246;
		deny all;
		proxy_pass http://localhost:8000;
		proxy_http_version 1.1;
		proxy_set_header Host revendas.brpdv.com.br;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Connection "";
	}

	location / {
		return 301 https://update.gestaoagil.com.br$request_uri;
	}
}
