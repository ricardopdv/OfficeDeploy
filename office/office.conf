# office.brpdv.com.br: OfficeManager web (pagina em /var/www/officev2/app) e a API (kestrel-officemanager,
# 127.0.0.1:3000) em /api; banco om no Postgres 18 local (porta 5433). Copia do servidor antigo (166.0.186.213).
# HTTPS: ate a virada, o certificado copiado do servidor antigo (/etc/nginx/ssl/office, vale ate 07/01/2027), para
# o Gateway que ja resolver o DNS novo encontrar HTTPS valido; depois da virada o certbot emite o daqui.
server {
	listen 80;
	listen 443 ssl;
	server_name office.brpdv.com.br;

	ssl_certificate /etc/letsencrypt/live/office.brpdv.com.br/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/office.brpdv.com.br/privkey.pem;
	include /etc/letsencrypt/options-ssl-nginx.conf;
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
	root /var/www/officev2/app;

	add_header X-Frame-Options "SAMEORIGIN";
	add_header X-Content-Type-Options "nosniff";
	charset utf-8;

	gzip on;
	gzip_types text/plain application/xml text/css application/javascript application/json;
	gzip_min_length 1000;

	# os Gateways mandam lotes de 100 notas com os XMLs
	client_max_body_size 20m;

	location / {
		try_files $uri $uri/ /index.html;
	}

	location /api {
		proxy_pass http://127.0.0.1:3000;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection keep-alive;
		proxy_set_header Host $host;
		proxy_cache_bypass $http_upgrade;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location = /favicon.ico { access_log off; log_not_found off; }
	location = /robots.txt { access_log off; log_not_found off; }
	location ~ /\.(?!well-known) { deny all; }
}
